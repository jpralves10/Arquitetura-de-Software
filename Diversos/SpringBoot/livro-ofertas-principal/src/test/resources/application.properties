spring.application.name=livro-ofertas-principal
server.port=8081

spring.datasource.url=jdbc:h2:file:/data/principal;INIT=RUNSCRIPT FROM 'classpath:data.sql'
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.sql.init.continue-on-error=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

kafka.environment=${KAFKA_ENV:localhost}:9092
kafka.consumer.topic-name=principalTopic
kafka.producer.topic-name=principalTopic


# Dados de conexão básica
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123

# Configuração do Pool de Conexões (Lettuce)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.timeout=5000ms

